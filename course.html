<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proglight - 講座</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="course.css">
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <div class="header-left">
        <a href="index.html" class="back-link">← 講座一覧に戻る</a>
      </div>
      <div class="header-center">
        <span class="site-title" id="course-title">読み込み中…</span>
      </div>
      <div class="header-right">
        <span class="badge-free">無料です</span>
      </div>
    </div>
  </header>

  <main class="course-layout">

    <!-- 左パネル: 説明エリア -->
    <section class="lesson-panel">
      <p class="course-description" id="course-description"></p>

      <nav class="lesson-nav" id="lesson-nav" aria-label="レッスン一覧"></nav>

      <div class="lesson-body">
        <h2 class="lesson-title" id="lesson-title"></h2>
        <div class="lesson-explanation" id="lesson-explanation"></div>
      </div>
    </section>

    <!-- 右パネル: 演習エリア -->
    <section class="editor-panel">
      <div class="editor-toolbar">
        <button id="run-btn" class="run-btn">▶ 実行する</button>
        <button id="reset-btn" class="reset-btn">元に戻す</button>
        <span id="run-status" class="run-status"></span>
      </div>

      <textarea id="code-editor" class="code-editor" spellcheck="false"></textarea>

      <div class="output-area">
        <iframe id="preview-frame" class="preview-frame" title="プレビュー" hidden></iframe>
        <pre id="console-output" class="console-output" hidden></pre>
      </div>
    </section>

  </main>

  <script src="course.js"></script>
</body>
</html>
